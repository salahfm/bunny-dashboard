name: Publish container image

# Magic Containers pulls a ready-made linux/amd64 image from Docker Hub or
# GitHub Container Registry, and this project has no build step of its own (the
# server runs TypeScript through tsx), so the image is just the Dockerfile.
# This workflow builds that image and pushes it to ghcr.io on every push to main
# (or on demand), which is the "Deploy with GitHub Actions" path bunny.net
# documents.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; repository names need not be.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
